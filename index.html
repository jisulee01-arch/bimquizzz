<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIM 전문가 2급 건축 필기</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222638;
    --border: #2e3350;
    --accent: #4f7cff;
    --accent2: #7c3aed;
    --correct: #22c55e;
    --wrong: #ef4444;
    --star: #f59e0b;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --radius: 12px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
  }
  .logo span { color: var(--muted); }
  .header-right { display: flex; gap: 8px; align-items: center; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  .tab {
    padding: 8px 18px;
    border-radius: 8px 8px 0 0;
    border: none;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    border-bottom: 2px solid transparent;
    position: relative;
    bottom: -1px;
  }
  .tab.active {
    color: var(--accent);
    border-bottom: 2px solid var(--accent);
    background: var(--bg);
  }
  .tab-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--star);
    color: #000;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    min-width: 18px;
    height: 18px;
    padding: 0 5px;
    margin-left: 6px;
  }

  /* MAIN */
  .main {
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  /* PROGRESS BAR */
  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 4px;
    height: 6px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 4px;
    transition: width 0.4s ease;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
  }

  /* QUESTION CARD */
  .q-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 16px;
    transition: border-color 0.2s;
  }
  .q-card.answered-correct { border-color: var(--correct); }
  .q-card.answered-wrong { border-color: var(--wrong); }

  .q-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
  }
  .q-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--accent);
    background: rgba(79,124,255,0.12);
    border-radius: 6px;
    padding: 3px 8px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .q-text {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
  }
  .star-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: var(--muted);
    transition: color 0.15s, transform 0.15s;
    flex-shrink: 0;
    line-height: 1;
    padding: 2px;
  }
  .star-btn.starred { color: var(--star); }
  .star-btn:hover { transform: scale(1.2); }

  /* OPTIONS */
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 11px 14px;
    cursor: pointer;
    text-align: left;
    font-size: 14px;
    color: var(--text);
    font-family: inherit;
    transition: all 0.15s;
    width: 100%;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(79,124,255,0.08);
  }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct {
    border-color: var(--correct);
    background: rgba(34,197,94,0.10);
    color: #86efac;
  }
  .opt-btn.wrong {
    border-color: var(--wrong);
    background: rgba(239,68,68,0.10);
    color: #fca5a5;
  }
  .opt-btn.dim { opacity: 0.4; }
  .opt-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    min-width: 18px;
  }
  .opt-btn.correct .opt-label { color: var(--correct); }
  .opt-btn.wrong .opt-label { color: var(--wrong); }

  /* RESULT BADGE */
  .result-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
  }
  .result-badge.ok { background: rgba(34,197,94,0.15); color: #4ade80; }
  .result-badge.ng { background: rgba(239,68,68,0.15); color: #f87171; }

  /* CONTROL BAR */
  .ctrl-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    border-radius: 8px;
    padding: 9px 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { background: #3d6bff; }
  .btn-ghost { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
  .btn-danger { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }
  .btn-danger:hover { background: rgba(239,68,68,0.25); }

  /* SCORE CARD */
  .score-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }
  .score-big {
    font-family: 'JetBrains Mono', monospace;
    font-size: 36px;
    font-weight: 600;
    color: var(--accent);
  }
  .score-big span { font-size: 16px; color: var(--muted); }
  .score-stats {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
  }
  .stat { display: flex; flex-direction: column; }
  .stat-val { font-size: 20px; font-weight: 700; }
  .stat-label { font-size: 11px; color: var(--muted); }
  .stat-val.ok { color: var(--correct); }
  .stat-val.ng { color: var(--wrong); }
  .stat-val.bm { color: var(--star); }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* HIDDEN */
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">BIM<span>/</span>2급 건축 <span>· 필기</span></div>
  <div class="header-right">
    <span id="hdr-score" style="font-size:12px;color:var(--muted);font-family:'JetBrains Mono',monospace;"></span>
  </div>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('all')">전체 문제</button>
  <button class="tab" onclick="switchTab('bookmark')" id="tab-bm">
    즐겨찾기 <span class="tab-badge" id="bm-count">0</span>
  </button>
</div>

<div class="main">
  <div id="page-all" class="page active">
    <div class="score-card" id="score-card">
      <div class="score-big" id="sc-pct">0%</div>
      <div class="score-stats">
        <div class="stat"><div class="stat-val ok" id="sc-correct">0</div><div class="stat-label">정답</div></div>
        <div class="stat"><div class="stat-val ng" id="sc-wrong">0</div><div class="stat-label">오답</div></div>
        <div class="stat"><div class="stat-val" id="sc-remain" style="color:var(--muted);">100</div><div class="stat-label">미풀이</div></div>
        <div class="stat"><div class="stat-val bm" id="sc-bm">0</div><div class="stat-label">즐겨찾기</div></div>
      </div>
    </div>

    <div class="progress-label">
      <span id="prg-label">진행률</span>
      <span id="prg-pct">0 / 100</span>
    </div>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="prg-fill" style="width:0%"></div></div>

    <div class="ctrl-bar">
      <button class="btn btn-danger" onclick="resetAll()">↺ 전체 초기화</button>
      <button class="btn btn-ghost" onclick="scrollToFirst()">⬇ 미풀이로 이동</button>
    </div>

    <div id="q-list"></div>
  </div>

  <div id="page-bm" class="page">
    <div class="ctrl-bar">
      <button class="btn btn-danger" onclick="resetBookmarks()">↺ 풀이 초기화</button>
    </div>
    <div id="bm-list"></div>
  </div>
</div>

<script>
const RAW = [
  {n:1, q:"레빗에서 프로젝트 브라우저의 사용 목적은 무엇인가?", opts:["보행 시선과 비슷하게 건물을 탐색할 수 있다.","파일 탐색기와 같이 여러 레빗 프로젝트를 관리할 수 있다.","프로젝트의 뷰를 관리하고 접근할 수 있다.","부분 상세와 같은 도면화에 필요한 모든 요소를 관리할 수 있다."], ans:3},
  {n:2, q:"레빗에서 3D 뷰에 대한 설명으로 옳지 않은 것은?", opts:["단면 상자를 이용하여 모델을 잘라내서 탐색할 수 있다.","단면 상자는 위, 아래, 좌, 우 4 방향만 조정할 수 있다.","카테고리별로 가시성/그래픽을 설정할 수 있다.","뷰 템플릿을 만들거나 적용할 수 있다."], ans:2},
  {n:3, q:"나비스웍스에서 간섭 검토에 대한 설명으로 옳지 않은 것은?", opts:["2차원 및 3차원 형상의 물리적 간섭을 검토할 수 있다.","통합된 모델의 요소를 사용할 수 있다.","결과를 시각적으로 표시하고, 리포트로 내보낼 수 있다.","Clash Detective 도구 창에서 간섭 검토를 실행할 수 있다."], ans:1},
  {n:4, q:"레빗에서 유형 특성과 특성의 차이는 무엇인가?", opts:["특성은 선택한 요소들의 파라미터를 저장하는 특성이다.","유형 특성은 같은 카테고리의 모든 요소에 영향을 미친다.","특성은 오직 뷰의 파라미터 만을 표시한다.","요소의 크기는 유형 특성으로만 정의될 수 있다."], ans:1},
  {n:5, q:"레빗에서 주석의 치수에 대한 설명으로 옳지 않은 것은?", opts:["정렬 치수는 평행 참조 또는 여러 점 사이에 치수를 배치한다.","반지름 치수는 내부 곡선 또는 모깍기의 반지름을 측정하는 치수를 배치한다.","지정점 레벨은 선택한 레벨의 입면을 표시한다.","지정점 좌표는 프로젝트에 있는 점의 북쪽/남쪽 및 동쪽/서쪽 좌표를 표시한다."], ans:3},
  {n:6, q:"레빗의 주요 특징으로 옳지 않은 것은?", opts:["일람표를 작성하여 모델의 정보를 표현한다.","일람표는 모델과 연결되지 않고 분리되어 존재한다.","모델의 형상 간 간섭 검토 수행할 수 있다.","모델과 뷰는 실시간 동기화 되어 일관성을 유지할 수 있다."], ans:2},
  {n:7, q:"레빗에서 주석의 상세정보에 대한 설명으로 옳지 않은 것은?", opts:["상세선은 모델의 세부 정보를 표현하기 위한 선이다.","채워진 영역은 뷰의 특정 부분에 닫힌 패턴을 작성한다.","구름형 수정기호는 뷰 또는 시트에 변경된 설계 영역을 표시한다.","단열재는 뷰에 단열재 그래픽을 배치하여 모든 뷰에 표시한다."], ans:4},
  {n:8, q:"레빗에서 현재 프로젝트에 없는 패밀리를 가져오기 위한 명령은?", opts:["패밀리 로드","장비 로드","컴포넌트 로드","기구 로드"], ans:1},
  {n:9, q:"레빗에서 상세 선, 채우기 영역 등의 상세 요소가 모델 요소와 다른 점은 무엇인가?", opts:["차이가 없다.","작성한 상세 요소는 일람표를 제외한 모든 뷰에서 표시된다.","상세 요소는 작성한 뷰에서만 표시된다.","상세 요소는 작성 후에 수정할 수 없다."], ans:3},
  {n:10, q:"나비스웍스에서 도구 창에 대한 설명으로 옳지 않은 것은?", opts:["저장된 관측점은 현재 뷰에서 보이는 모습을 저장하여 활용한다.","선택 트리는 모델을 구성하는 소스 파일을 표시 및 선택한다.","특성은 현재 뷰의 특성을 표시한다.","Clash Detective 는 3차원 모델의 요소들간 간섭을 검토한다."], ans:3},
  {n:11, q:"레빗의 레벨에 대한 설명으로 옳지 않은 것은?", opts:["모델의 수직 높이 또는 층을 정의한다.","평면도, 단면도 등에서 작성할 수 있다.","명령은 건축 또는 구조 탭의 기준 패널에 있다.","레벨을 이동하면 연관된 요소도 함께 이동된다."], ans:2},
  {n:12, q:"레빗에서 요소들간의 겹치는 부분을 제거하여 중복된 형상을 없애는 기능은?", opts:["형상 결합","코핑","면 분할","페인트"], ans:1},
  {n:13, q:"레빗에서 현재 뷰에 표시되는 같은 유형의 모든 요소를 선택하는 방법은?", opts:["뷰에서 모든 요소 선택 > 필터 > 원하는 유형만 체크","요소 선택 > 우클릭 메뉴 > 모든 인스턴스 선택 > 뷰에 나타남","요소 선택 > 우클릭 메뉴 > 유사 작성","요소 선택 > 우클릭 메뉴 > 모든 인스턴스 선택 > 전체 프로젝트에서"], ans:2},
  {n:14, q:"레빗에서 렌더링 작업에 대한 설명으로 옳지 않은 것은?", opts:["카메라뷰, 평면도 등 대부분의 뷰에서 렌더링을 할 수 있다.","뷰의 범위를 조정하여 불필요한 요소가 표시되지 않도록 한다.","품질, 해상도 등이 높을수록 렌더링 시간이 오래 걸린다.","렌더링 결과물을 프로젝트 탐색기에 저장할 수 있다."], ans:1},
  {n:15, q:"레빗에서 요소의 이동 또는 복사 명령을 실행하는 방법은 무엇인가?", opts:["요소 선택 > 메뉴에서 명령 클릭 > 뷰에서 시작점과 끝점을 차례로 클릭","메뉴에서 명령 클릭 > 요소 선택 > 뷰에서 시작점과 끝점을 차례로 클릭","요소 선택 > 우클릭 메뉴에서 이동 또는 복사 클릭 > 뷰에서 시작점과 끝점을 차례로 클릭","메뉴에서 명령 클릭 > 뷰에서 시작점과 끝점을 차례로 클릭 > 요소 선택"], ans:1},
  {n:16, q:"레빗에서 시트에 대한 설명으로 옳지 않은 것은?", opts:["제목블록에 평면도, 일람표 등의 뷰를 배치하여 도면화한다.","작성한 시트는 프로젝트 탐색기의 시트에 저장된다.","평면도, 단면도 등 대부분의 뷰는 여러 시트에 사용할 수 있다.","시트 명령을 이용하거나 프로젝트 탐색기에서 뷰를 드래그하여 시트에 배치할 수 있다."], ans:3},
  {n:17, q:"레빗에서 링크에 대한 설명으로 옳지 않은 것은?", opts:["Revit, IFC, CAD 등을 링크할 수 있다.","일람표에 링크한 모델의 요소를 표현하여 물량 산출 등에 활용할 수 있다.","뷰에서 링크한 모델에 치수, 태그 등을 작성하여 도면화할 수 있다.","링크된 모델이 업데이트 된 경우 프로그램을 재시작해야만 반영된다."], ans:4},

const LABELS = ['①','②','③','④'];
const KEY = 'bim2_state';

let state = {};

function loadState() {
  try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch { state = {}; }
}
function saveState() {
  localStorage.setItem(KEY, JSON.stringify(state));
}

function getStats() {
  let correct = 0, wrong = 0, bm = 0;
  RAW.forEach(q => {
    const s = state[q.n];
    if (s) {
      if (s.result === 'correct') correct++;
      else if (s.result === 'wrong') wrong++;
      if (s.starred) bm++;
    }
  });
  return { correct, wrong, bm, remain: RAW.length - correct - wrong };
}

function updateHeader() {
  const { correct, wrong, remain } = getStats();
  const answered = correct + wrong;
  const pct = answered === 0 ? 0 : Math.round(correct / answered * 100);
  document.getElementById('hdr-score').textContent = answered > 0 ? `정답률 ${pct}%` : '';
}

function updateScoreCard() {
  const { correct, wrong, bm, remain } = getStats();
  const answered = correct + wrong;
  const pct = answered === 0 ? 0 : Math.round(correct / answered * 100);
  document.getElementById('sc-pct').innerHTML = `${pct}<span>%</span>`;
  document.getElementById('sc-correct').textContent = correct;
  document.getElementById('sc-wrong').textContent = wrong;
  document.getElementById('sc-remain').textContent = remain;
  document.getElementById('sc-bm').textContent = bm;
  document.getElementById('prg-fill').style.width = `${(answered/RAW.length)*100}%`;
  document.getElementById('prg-pct').textContent = `${answered} / ${RAW.length}`;
  document.getElementById('bm-count').textContent = bm;
  updateHeader();
}

function renderCard(q, container, mini) {
  const s = state[q.n] || {};
  const answered = !!s.result;
  const starred = !!s.starred;

  const card = document.createElement('div');
  card.className = 'q-card' + (answered ? (s.result === 'correct' ? ' answered-correct' : ' answered-wrong') : '');
  card.id = `qcard-${q.n}`;

  const hdr = document.createElement('div');
  hdr.className = 'q-header';

  const num = document.createElement('div');
  num.className = 'q-num';
  num.textContent = `Q${String(q.n).padStart(2,'0')}`;

  const txt = document.createElement('div');
  txt.className = 'q-text';
  txt.textContent = q.q;

  const starBtn = document.createElement('button');
  starBtn.className = 'star-btn' + (starred ? ' starred' : '');
  starBtn.textContent = '★';
  starBtn.title = '즐겨찾기';
  starBtn.onclick = () => toggleStar(q.n);

  hdr.appendChild(num);
  hdr.appendChild(txt);
  hdr.appendChild(starBtn);
  card.appendChild(hdr);

  const opts = document.createElement('div');
  opts.className = 'options';

  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.disabled = answered;

    let cls = '';
    if (answered) {
      if (i + 1 === q.ans) cls = 'correct';
      else if (s.chosen === i + 1) cls = 'wrong';
      else cls = 'dim';
    }
    if (cls) btn.classList.add(cls);

    const lbl = document.createElement('span');
    lbl.className = 'opt-label';
    lbl.textContent = LABELS[i];

    btn.appendChild(lbl);
    btn.appendChild(document.createTextNode(opt));
    btn.onclick = () => answer(q.n, i + 1);
    opts.appendChild(btn);
  });

  card.appendChild(opts);

  if (answered) {
    const badge = document.createElement('div');
    badge.className = 'result-badge ' + (s.result === 'correct' ? 'ok' : 'ng');
    badge.textContent = s.result === 'correct' ? '✓ 정답입니다!' : `✗ 오답 — 정답: ${LABELS[q.ans-1]} ${q.opts[q.ans-1]}`;
    card.appendChild(badge);
  }

  container.appendChild(card);
}

function answer(qn, chosen) {
  const q = RAW.find(x => x.n === qn);
  if (!q || state[qn]?.result) return;
  state[qn] = { ...state[qn], result: chosen === q.ans ? 'correct' : 'wrong', chosen };
  saveState();
  updateScoreCard();
  // re-render card
  const old = document.getElementById(`qcard-${qn}`);
  if (old) {
    const parent = old.parentNode;
    old.remove();
    const tmp = document.createElement('div');
    renderCard(q, tmp);
    parent.insertBefore(tmp.firstChild, parent.children[Array.from(parent.children).indexOf(old)] || null);
  }
  renderAll();
  renderBookmarks();
}

function toggleStar(qn) {
  if (!state[qn]) state[qn] = {};
  state[qn].starred = !state[qn].starred;
  saveState();
  updateScoreCard();
  renderAll();
  renderBookmarks();
}

function renderAll() {
  const container = document.getElementById('q-list');
  container.innerHTML = '';
  RAW.forEach(q => renderCard(q, container));
}

function renderBookmarks() {
  const container = document.getElementById('bm-list');
  container.innerHTML = '';
  const bms = RAW.filter(q => state[q.n]?.starred);
  if (bms.length === 0) {
    container.innerHTML = '<div class="empty"><div class="icon">☆</div><div>즐겨찾기한 문제가 없습니다.</div></div>';
    return;
  }
  bms.forEach(q => renderCard(q, container));
}

function switchTab(t) {
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  if (t === 'all') {
    document.querySelectorAll('.tab')[0].classList.add('active');
    document.getElementById('page-all').classList.add('active');
  } else {
    document.querySelectorAll('.tab')[1].classList.add('active');
    document.getElementById('page-bm').classList.add('active');
    renderBookmarks();
  }
}

function resetAll() {
  if (!confirm('전체 풀이 기록을 초기화하시겠습니까?\n즐겨찾기는 유지됩니다.')) return;
  RAW.forEach(q => {
    if (state[q.n]) { delete state[q.n].result; delete state[q.n].chosen; }
  });
  saveState();
  updateScoreCard();
  renderAll();
}

function resetBookmarks() {
  if (!confirm('즐겨찾기 문제의 풀이 기록을 초기화하시겠습니까?')) return;
  RAW.forEach(q => {
    if (state[q.n]?.starred) { delete state[q.n].result; delete state[q.n].chosen; }
  });
  saveState();
  updateScoreCard();
  renderAll();
  renderBookmarks();
}

function scrollToFirst() {
  const first = RAW.find(q => !state[q.n]?.result);
  if (first) {
    const el = document.getElementById(`qcard-${first.n}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

// INIT
loadState();
renderAll();
updateScoreCard();
</script>
